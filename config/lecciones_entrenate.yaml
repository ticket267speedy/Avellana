  # ═══════════════════════════════════════════════════════════════════════════
  # LA COMPLETA
  # ═══════════════════════════════════════════════════════════════════════════
  - numero: 6
    habilidad: conozco_mis_derechos
    titulo: "Que cambia cuando cumplo 18"
    objetivo: >-
      Se que decisiones sobre mi salud pasan a ser mias el dia que cumplo 18,
      quien puede y quien no puede ver mi informacion, y que tengo que hacer
      antes de esa fecha.
    estado_contenido: completo

    pasos:
      aprender: |
        El dia que cumples 18 anios, tres cosas cambian a la vez. No cambian
        poco a poco: cambian ese dia.

        **1. Las decisiones sobre tu salud pasan a ser tuyas.**
        Hasta los 18, tus padres o tu tutor deciden por ti y firman por ti.
        Desde el dia de tu cumpleanos, adquieres capacidad de ejercicio: eres
        tu quien firma un consentimiento antes de un procedimiento, y eres tu
        quien puede negarse. Nadie puede hacerlo en tu nombre salvo que tu lo
        autorices.

        **2. Tu informacion de salud deja de ser accesible para tu familia.**
        Esto sorprende a casi todo el mundo. Tus datos de salud son datos
        sensibles y son tuyos. Tu madre, que lleva anos pidiendo tus
        resultados y hablando con tus medicos, deja de poder hacerlo
        automaticamente. Puede seguir haciendolo solo si tu lo autorizas
        expresamente, y puedes retirar esa autorizacion cuando quieras.

        Esto no es un castigo para tu familia. Es el reconocimiento de que la
        informacion es tuya, y de que a partir de ahora decides tu quien la ve.

        **3. Dejas de poder atenderte en el INSN.**
        El Instituto Nacional de Salud del Nino no atiende a mayores de 18
        anios. No es una demora ni una lista de espera: es un corte, en fecha
        exacta. Por eso existe todo lo que estas viendo en esta aplicacion —
        para que el dia que eso pase, tu ya tengas otro hospital que te espere.

        **Y una cosa que NO sabemos todavia, y preferimos decirtelo:**
        que pasa exactamente con tu SIS al cumplir 18 anios. Hay reglas
        distintas segun el regimen y estamos confirmandolo con el Servicio
        Social del INSN. Cuando lo sepamos con certeza, esta leccion se
        actualiza. Preguntalo tu tambien en tu proxima consulta: es de las
        cosas mas importantes que tienes que tener resueltas antes de tu
        cumpleanos.

      practicar: |
        Responde para ti mismo, sin buscar:

        1. Si manana cumplieras 18 y tuvieras que firmar un consentimiento
           para un procedimiento, ¿quien firmaria? ¿Sabrias que estas
           firmando?

        2. ¿Quieres que tu madre, tu padre o alguien mas pueda seguir viendo
           tu informacion de salud despues de los 18? No hay respuesta
           correcta. Hay gente que si y gente que no, y las dos son validas.

        3. Si dijeras que si, ¿toda tu informacion, o solo saber como va tu
           tramite de traspaso? Tambien puedes autorizar solo una parte.

        4. ¿Sabes en que hospital te vas a atender despues? ¿Y sabes si ya te
           aceptaron?

      desafio: |
        Un caso, para pensarlo:

        > Carla cumplio 18 hace dos meses. Su mama llama al hospital para
        > pedir el resultado de un examen, como ha hecho siempre. Le dicen que
        > no se lo pueden dar.
        >
        > La mama se enfada. Dice que es su hija y que siempre se lo han dado.

        ¿Quien tiene razon?

        **El hospital.** Y no por burocracia: los datos de salud de Carla son
        datos sensibles suyos, y desde que cumplio 18 solo ella decide quien
        los ve. Si Carla quiere que su mama pueda pedirlos, basta con que lo
        autorice — y puede hacerlo hoy mismo, o retirarlo el mes que viene.

        Lo que salio mal aqui no es la regla. Es que nadie se lo dijo a Carla
        ni a su mama antes de que ocurriera. Por eso estas leyendo esto ahora
        y no dentro de dos anios.

      tarea_real: |
        **Esta semana, dos cosas. Las dos fuera de la pantalla.**

        **Una:** habla con tu madre, tu padre o quien te acompane a las
        consultas. Cuentale lo que acabas de leer. Decidid juntos si quieres
        autorizarle el acceso a tu informacion cuando cumplas 18, y a que
        parte. No hace falta que lo decidas hoy — hace falta que la
        conversacion ocurra antes de tu cumpleanos y no el dia despues.

        Si decides autorizarlo, puedes dejarlo registrado en esta aplicacion
        desde ahora: queda preparado y empieza a valer el dia del corte.

        **Dos:** en tu proxima consulta, pregunta dos cosas concretas:
        · "¿Que pasa con mi SIS cuando cumpla 18?"
        · "¿En que hospital me voy a atender despues, y ya me aceptaron?"

        Anota las respuestas. Si te dicen que no lo saben, eso tambien es una
        respuesta y hay que anotarla.

      retroalimentacion: |
        Cuando hayas hecho las dos tareas, vuelve y marca esta habilidad como
        lograda.

        Y si la conversacion con tu familia fue dificil, o si en la consulta no
        supieron responderte, escribelo tambien. Lo segundo sobre todo: si el
        equipo del INSN no puede responder a esas dos preguntas, ese es un
        hallazgo del sistema, no un fallo tuyo.

    # Cada afirmacion con su fuente, VISIBLE PARA EL USUARIO. Una leccion que
    # le dice a un adolescente que su madre ya no puede pedir sus resultados
    # tiene que poder decirle tambien en que norma esta escrito, o es
    # indistinguible de un rumor.
    fuentes:
      - afirmacion: "A los 18 anios adquieres capacidad de ejercicio y decides sobre tu salud"
        norma: "Codigo Civil peruano, art. 42"
        detalle: >-
          La capacidad de ejercicio plena se adquiere a los dieciocho anios.
          Antes de esa edad, la patria potestad (arts. 418 y ss.) atribuye a
          los padres el deber y el derecho de cuidar de la persona del menor.

      - afirmacion: "Tus datos de salud son datos sensibles y son tuyos"
        norma: "Ley 29733 de Proteccion de Datos Personales, art. 2.5"
        detalle: >-
          Los datos relativos a la salud son datos sensibles. Su tratamiento
          exige consentimiento previo, informado, expreso e inequivoco del
          titular.

      - afirmacion: "El consentimiento informado sobre tu tratamiento pasa a ser tuyo"
        norma: "Ley 26842, Ley General de Salud, art. 4"
        detalle: >-
          Ninguna persona puede ser sometida a tratamiento medico o quirurgico
          sin su consentimiento previo.

      - afirmacion: "El INSN no atiende a mayores de 18 anios"
        norma: "Regla institucional del INSN San Borja"
        detalle: >-
          Confirmada por el equipo de la Unidad de Atencion Integral
          Especializada. El corte es duro y en fecha exacta.

      - afirmacion: "Que pasa con el SIS al cumplir 18 — PENDIENTE DE CONFIRMAR"
        norma: "TODO: confirmar con Servicio Social del INSN"
        detalle: >-
          No lo afirmamos porque no lo hemos verificado. Lo que si esta
          verificado es el caso de EsSalud: los hijos dejan de ser
          derechohabientes a los 18 salvo que acrediten incapacidad total y
          permanente ante la Comision Medica Evaluadora (Ley 26790).

