# ─────────────────────────────────────────────────────────────────────────────
# Entrenate — contenido de las siete lecciones
#
# CONTENIDO, NO CODIGO. Vive aqui por el mismo motivo que los plazos y los
# betas del indice: es material que un profesional del INSN tiene que poder
# leer, discutir y corregir sin abrir un editor de codigo.
#
# NOTA DE VOCABULARIO: se llaman LECCIONES, nunca "modulos". En software esa
# palabra significa otra cosa y ya causo confusion en el equipo.
#
# ═════════════════════════════════════════════════════════════════════════════
# UNA COMPLETA, SEIS ESQUELETOS — y por que
# ═════════════════════════════════════════════════════════════════════════════
#
# La leccion 6, "Que cambia cuando cumplo 18", esta completa. Se eligio esa y
# no "Mi condicion" por cuatro razones que se apilan:
#
#   (a) es la unica de las siete que habla del acantilado legal que le da
#       nombre al reto;
#   (b) es contenido JURIDICO Y ADMINISTRATIVO, no clinico, asi que el equipo
#       puede escribir y defender cada frase sin la firma de un medico
#       (regla inviolable 4);
#   (c) tiene carga emocional real: el adolescente descubre que su madre ya no
#       puede pedir sus resultados y que ahora decide el;
#   (d) es la unica cuyo contenido se conecta con un mecanismo que ya
#       construimos — la compuerta de consentimiento del apoderado, en
#       `dominio/entidades/acceso_apoderado.py`. Contenido y codigo cuentan la
#       misma historia.
#
# Las otras seis van en esqueleto, con el sello visible "Contenido pendiente
# de validacion clinica del INSN". No se inventa contenido clinico: un
# esqueleto honesto es mas fuerte ante un jurado clinico que siete lecciones
# que nadie del equipo puede defender.
#
# Si durante la hackathon un medico del INSN valida contenido, la leccion 1
# puede completarse tambien. Es ganancia extra, no requisito.
# ─────────────────────────────────────────────────────────────────────────────

