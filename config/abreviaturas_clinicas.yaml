  TCSC: "tejido celular subcutaneo"
  MTD: "miembro toracico derecho"
  MTI: "miembro toracico izquierdo"
  MPD: "miembro pelvico derecho"
  MPI: "miembro pelvico izquierdo"
  MSD: "miembro superior derecho"
  MSI: "miembro superior izquierdo"
  MID: "miembro inferior derecho"
  MII: "miembro inferior izquierdo"
  IMC: "indice de masa corporal"
  FC: "frecuencia cardiaca"
  FR: "frecuencia respiratoria"
  SatO2: "saturacion de oxigeno"
  ACP: "auscultacion cardiopulmonar"
  MV: "murmullo vesicular"
  RCR: "ruidos cardiacos regulares"
  RHA: "ruidos hidroaereos"
  LOTEP: "lucido orientado en tiempo espacio y persona"

  # ── Antecedentes ──────────────────────────────────────────────────────────
