  TDAH: "trastorno por deficit de atencion e hiperactividad"
  TEA: "trastorno del espectro autista"

# ═════════════════════════════════════════════════════════════════════════════
# NUNCA EXPANDIR — falsos positivos conocidos.
# Cadenas que parecen abreviaturas y no lo son. Sin esta lista el normalizador
# destroza el texto.
# ═════════════════════════════════════════════════════════════════════════════
nunca_expandir:
  - "mg"
  - "ml"
  - "kg"
  - "cm"
  - "mm"
  - "dl"
  - "UI"
  - "VO"
  - "EV"
  - "IM"
  - "SC"
  - "PRN"
  - "BID"
  - "TID"
  - "QD"
