  UCI: "unidad de cuidados intensivos"
  UCIP: "unidad de cuidados intensivos pediatricos"
  HC: "historia clinica"
  CE: "consultorio externo"
  SIS: "Seguro Integral de Salud"
  DNI: "documento nacional de identidad"
