  # ── Diagnosticos inequivocos en contexto pediatrico peruano ───────────────
  ERC: "enfermedad renal cronica"
  FQ: "fibrosis quistica"
  LLA: "leucemia linfoblastica aguda"
  AME: "atrofia muscular espinal"
  HTP: "hipertension pulmonar"
  CIV: "comunicacion interventricular"
  CIA: "comunicacion interauricular"
  TGA: "transposicion de grandes arterias"
